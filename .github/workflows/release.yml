name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: windows-latest
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Resolve version tag
        id: meta
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # 先打包，不交给 electron-builder 上传：它的 GitHub 发布任务并发时会撞 422
      - name: Build installer
        run: npx electron-builder --win nsis --publish never

      # ---- Azure Trusted Signing：未配置 AZURE_* secrets 时整段跳过 ----
      - name: Stage unpacked app for signing
        if: env.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: |
          Copy-Item -Recurse dist\win-unpacked app-signed
          Get-ChildItem app-signed | Select-Object -First 5 Name

      - name: Azure login
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Sign app files
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/code-sign-action@v1
        with:
          trusted-signing-account-name: ${{ secrets.AZURE_TS_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_TS_PROFILE_NAME }}
          files: ${{ github.workspace }}\app-signed
          recursive: true
          description: "XuanLuo Gacha Export Hub"
          description-url: "https://github.com/XLoDream/XuanLuo-Gacha-Export-Hub"

      - name: Rebuild installer from signed app
        if: env.AZURE_CLIENT_ID != ''
        run: npx electron-builder --win nsis --prepackaged app-signed --publish never

      - name: Build mini launcher
        shell: pwsh
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /target:winexe /out:dist\XuanLuo-Gacha-Export-Hub-MiniSetup.exe /win32icon:icon\app.ico /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /reference:System.Web.Extensions.dll launcher\Program.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item dist\XuanLuo-Gacha-Export-Hub-MiniSetup.exe | Select-Object Name, @{N='SizeKB';E={[math]::Round($_.Length/1KB,1)}}

      - name: Build MiniGetGachaLink
        shell: pwsh
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /target:winexe /out:dist\MiniGetGachaLink.exe /win32icon:icon\app.ico /reference:System.Web.Extensions.dll /reference:System.Windows.Forms.dll /reference:System.Drawing.dll MiniGetGachaLink\Program.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item dist\MiniGetGachaLink.exe | Select-Object Name, @{N='SizeKB';E={[math]::Round($_.Length/1KB,1)}}

      - name: Sign mini tools
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/code-sign-action@v1
        with:
          trusted-signing-account-name: ${{ secrets.AZURE_TS_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_TS_PROFILE_NAME }}
          files: |
            ${{ github.workspace }}\dist\XuanLuo-Gacha-Export-Hub-MiniSetup.exe
            ${{ github.workspace }}\dist\MiniGetGachaLink.exe
          description: "XuanLuo Gacha Export Hub"
          description-url: "https://github.com/XLoDream/XuanLuo-Gacha-Export-Hub"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body_path: RELEASE_NOTES.md
          draft: false
          make_latest: true
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
